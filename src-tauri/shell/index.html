<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Litura</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: #f3eee2;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1a1917; }
      }

      .mark { width: 88px; height: auto; display: block; }

      /* Waiting, not working: a quiet pulse until the editor is ready. */
      .mark { animation: breathe 1.9s ease-in-out infinite; }
      @keyframes breathe {
        0%, 100% { opacity: .55; }
        50%      { opacity: 1; }
      }
      /* Drawn, not drawing: the same picture without the movement. */
      @media (prefers-reduced-motion: reduce) {
        .mark { animation: none; }
      }
    </style>
  </head>
  <!-- Shown for the second it takes the server to bind a port. The editor
       itself is served by that server, not from here. -->
  <body>
    <img class="mark" src="logo.svg" alt="Starting Litura">
  </body>
</html>
