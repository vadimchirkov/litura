[package]
name = "litura"
version = "0.0.0"                       # read from package.json by tauri.conf.json
description = "A local AI-assisted editor for sharper, more human writing"
authors = ["Vadim Chirkov"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"   # tauri::generate_context! expands into it
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
