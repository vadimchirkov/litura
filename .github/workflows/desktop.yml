name: Desktop build

# A tag builds the desktop app for every platform and attaches the bundles —
# and the signed latest.json the updater reads — to a draft release. The draft
# becomes the latest release only after every platform has built and passed its
# smoke test: the updater follows releases/latest, which never shows a draft.
# Manual runs are for checking that the build still works without cutting a
# release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Made once, before the matrix: drafts are not unique per tag, so four jobs
  # racing to create one could split the bundles across several.
  draft:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" \
            -f name="Stilura $GITHUB_REF_NAME" -f body='See CHANGELOG.md for what changed.' \
            -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: draft
    # A manual run skips the draft and still builds.
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    permissions:
      contents: write   # the draft the bundles are attached to
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest    # Apple silicon
            target: aarch64-apple-darwin
          - platform: macos-15-intel  # Intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cargo compiles the same 500 crates on every run otherwise.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev xvfb

      - run: npm ci

      # tauri build runs desktop:prepare itself (beforeBuildCommand), which
      # bundles the frontend, bundles the server, and fetches the Node runtime
      # for this target.
      # Unset before an Apple Developer ID exists. Then the fallback signs the
      # bundle ad-hoc, which is not a trusted signature but is a valid one:
      # macOS offers the writer `Open Anyway` instead of calling the app
      # damaged and sending them to the Trash. A missing secret still arrives
      # as an empty variable, and Tauri tries to import an empty
      # APPLE_CERTIFICATE, so only the ones that are set are passed on.
      - name: Apple signing credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              printf '%s<<__STILURA_EOF__\n%s\n__STILURA_EOF__\n' "$name" "${!name}" >> "$GITHUB_ENV"
            fi
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # uploads to the draft
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        with:
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.draft.outputs.id }}
          # A draft's download URLs say untagged-…; latest.json gets the tag's.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseBody: See CHANGELOG.md for what changed.
          # The updater reads this file from the latest release; without it a
          # published build is invisible to every copy already installed.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # Everything below the window has its own checks. What only a built
      # bundle can get wrong — resources that did not travel, a sidecar for the
      # wrong architecture, a runtime that will not start — is asked here, by
      # running the thing that was just packaged. A red job keeps the release
      # a draft.
      - name: Smoke-test the bundle
        run: ${{ startsWith(matrix.platform, 'ubuntu') && 'xvfb-run -a npm run smoke:desktop' || 'npm run smoke:desktop' }}

  publish:
    needs: [draft, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: repos/${{ github.repository }}/releases/${{ needs.draft.outputs.id }}
    steps:
      # Jobs that upload at the same moment can overwrite each other's entry.
      - name: Check latest.json lists every platform
        run: |
          asset=$(gh api "$RELEASE/assets" --jq '.[] | select(.name == "latest.json") | .id')
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset" \
            | jq -e '.platforms | has("darwin-aarch64") and has("darwin-x86_64") and has("linux-x86_64") and has("windows-x86_64")'
      - run: gh api -X PATCH "$RELEASE" -F draft=false -f make_latest=true --silent
